<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaboration Support ROI Calculator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const DollarSign = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <line x1="12" y1="1" x2="12" y2="23"></line>
                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
        );

        const Users = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
        );

        const TrendingUp = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
        );

        const AlertCircle = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );

        function CollaborationROICalculator() {
            const [inputs, setInputs] = useState({
                employees: 5000,
                ticketsPerEmployee: 2.5,
                tier1Cost: 25,
                tier2Cost: 75,
                tier3Cost: 250,
                currentTier1Resolution: 30,
                withSolutionTier1Resolution: 75,
                tier2EscalationRate: 50,
                tier3EscalationRate: 20
            });

            const handleInputChange = (field, value) => {
                const parsed = value === '' ? 0 : parseFloat(value);
                setInputs(prev => ({ ...prev, [field]: Number.isNaN(parsed) ? 0 : parsed }));
            };

            // Calculations
            const totalAnnualTickets = inputs.employees * inputs.ticketsPerEmployee;
            const currentTier1Tickets = totalAnnualTickets * (inputs.currentTier1Resolution / 100);
            const unresolvedCurrent = totalAnnualTickets - currentTier1Tickets;
            const currentTier2Tickets = unresolvedCurrent * (inputs.tier2EscalationRate / 100);
            const currentTier3Tickets = unresolvedCurrent * (inputs.tier3EscalationRate / 100);

            const currentTier1Cost = currentTier1Tickets * inputs.tier1Cost;
            const currentTier2Cost = currentTier2Tickets * inputs.tier2Cost;
            const currentTier3Cost = currentTier3Tickets * inputs.tier3Cost;
            const currentTotalCost = currentTier1Cost + currentTier2Cost + currentTier3Cost;

            // With Solution
            const withSolutionTier1Tickets = totalAnnualTickets * (inputs.withSolutionTier1Resolution / 100);
            const unresolvedWithSolution = totalAnnualTickets - withSolutionTier1Tickets;
            const withSolutionTier2Tickets = unresolvedWithSolution * (inputs.tier2EscalationRate / 100);
            const withSolutionTier3Tickets = unresolvedWithSolution * (inputs.tier3EscalationRate / 100);

            const withSolutionTier1Cost = withSolutionTier1Tickets * inputs.tier1Cost;
            const withSolutionTier2Cost = withSolutionTier2Tickets * inputs.tier2Cost;
            const withSolutionTier3Cost = withSolutionTier3Tickets * inputs.tier3Cost;
            const withSolutionTotalCost = withSolutionTier1Cost + withSolutionTier2Cost + withSolutionTier3Cost;

            const annualSavings = currentTotalCost - withSolutionTotalCost;
            const roi = currentTotalCost > 0 ? ((annualSavings / currentTotalCost) * 100) : 0;
            const ticketsDeflected = (currentTier2Tickets + currentTier3Tickets) - (withSolutionTier2Tickets + withSolutionTier3Tickets);

            const formatCurrency = (value) => {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0
                }).format(value);
            };

            const formatNumber = (value) => {
                return new Intl.NumberFormat('en-US', {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0
                }).format(value);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 p-8">
                    <div className="max-w-7xl mx-auto">
                        <div className="text-center mb-8">
                            <h1 className="text-4xl font-bold text-white mb-2">
                                Collaboration Support ROI Calculator
                            </h1>
                            <p className="text-gray-300 text-lg">
                                Calculate the value of resolving collaboration app tickets at Tier 1 vs escalation
                            </p>
                        </div>

                        <div className="grid md:grid-cols-3 gap-6 mb-8">
                            <div className="bg-gray-800 rounded-lg shadow-lg p-6 border-l-4 border-green-500">
                                <div className="flex items-center justify-between mb-2">
                                    <h3 className="text-lg font-semibold text-gray-200">Annual Savings</h3>
                                    <DollarSign size={24} className="text-green-400" />
                                </div>
                                <p className="text-3xl font-bold text-green-400">{formatCurrency(annualSavings)}</p>
                                <p className="text-sm text-gray-400 mt-1">Per year</p>
                            </div>

                            <div className="bg-gray-800 rounded-lg shadow-lg p-6 border-l-4 border-blue-500">
                                <div className="flex items-center justify-between mb-2">
                                    <h3 className="text-lg font-semibold text-gray-200">Cost Reduction</h3>
                                    <TrendingUp size={24} className="text-blue-400" />
                                </div>
                                <p className="text-3xl font-bold text-blue-400">{roi.toFixed(1)}%</p>
                                <p className="text-sm text-gray-400 mt-1">ROI percentage</p>
                            </div>

                            <div className="bg-gray-800 rounded-lg shadow-lg p-6 border-l-4 border-purple-500">
                                <div className="flex items-center justify-between mb-2">
                                    <h3 className="text-lg font-semibold text-gray-200">Tickets Deflected</h3>
                                    <AlertCircle size={24} className="text-purple-400" />
                                </div>
                                <p className="text-3xl font-bold text-purple-400">{formatNumber(ticketsDeflected)}</p>
                                <p className="text-sm text-gray-400 mt-1">From Tier 2/3 annually</p>
                            </div>
                        </div>

                        <div className="grid md:grid-cols-2 gap-8">
                            <div className="bg-gray-800 rounded-lg shadow-lg p-6">
                                <h2 className="text-2xl font-bold text-white mb-6 flex items-center">
                                    <Users size={28} className="mr-2 text-indigo-400" />
                                    Organization Settings
                                </h2>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-300 mb-2">
                                            Number of Employees
                                        </label>
                                        <input
                                            type="number"
                                            value={inputs.employees}
                                            onChange={(e) => handleInputChange('employees', e.target.value)}
                                            className="w-full px-4 py-2 bg-gray-700 border border-gray-600 text-white rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-300 mb-2">
                                            Collaboration App Tickets per Employee/Year
                                        </label>
                                        <input
                                            type="number"
                                            step="0.1"
                                            value={inputs.ticketsPerEmployee}
                                            onChange={(e) => handleInputChange('ticketsPerEmployee', e.target.value)}
                                            className="w-full px-4 py-2 bg-gray-700 border border-gray-600 text-white rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        />
                                        <p className="text-xs text-gray-400 mt-1">Industry avg: 2-3 tickets/employee/year</p>
                                    </div>

                                    <div className="pt-4 border-t border-gray-700">
                                        <h3 className="font-semibold text-gray-300 mb-3">Support Tier Costs</h3>
                                        
                                        <div className="space-y-3">
                                            <div>
                                                <label className="block text-sm text-gray-400 mb-1">Tier 1 (Self-Service/Basic)</label>
                                                <div className="flex items-center">
                                                    <span className="text-gray-400 mr-2">$</span>
                                                    <input
                                                        type="number"
                                                        value={inputs.tier1Cost}
                                                        onChange={(e) => handleInputChange('tier1Cost', e.target.value)}
                                                        className="flex-1 px-4 py-2 bg-gray-700 border border-gray-600 text-white rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                                    />
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-sm text-gray-400 mb-1">Tier 2 (Specialist)</label>
                                                <div className="flex items-center">
                                                    <span className="text-gray-400 mr-2">$</span>
                                                    <input
                                                        type="number"
                                                        value={inputs.tier2Cost}
                                                        onChange={(e) => handleInputChange('tier2Cost', e.target.value)}
                                                        className="flex-1 px-4 py-2 bg-gray-700 border border-gray-600 text-white rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                                    />
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-sm text-gray-400 mb-1">Tier 3 (Expert/Engineering)</label>
                                                <div className="flex items-center">
                                                    <span className="text-gray-400 mr-2">$</span>
                                                    <input
                                                        type="number"
                                                        value={inputs.tier3Cost}
                                                        onChange={(e) => handleInputChange('tier3Cost', e.target.value)}
                                                        className="flex-1 px-4 py-2 bg-gray-700 border border-gray-600 text-white rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-gray-800 rounded-lg shadow-lg p-6">
                                <h2 className="text-2xl font-bold text-white mb-6">
                                    Resolution Scenarios
                                </h2>

                                <div className="space-y-6">
                                    <div className="bg-red-900 bg-opacity-30 p-4 rounded-lg border border-red-700">
                                        <h3 className="font-semibold text-red-300 mb-3">Current State (Without Solution)</h3>
                                        <div>
                                            <label className="block text-sm text-gray-300 mb-2">
                                                Tier 1 Resolution Rate
                                            </label>
                                            <div className="flex items-center">
                                                <input
                                                    type="range"
                                                    min="0"
                                                    max="100"
                                                    value={inputs.currentTier1Resolution}
                                                    onChange={(e) => handleInputChange('currentTier1Resolution', e.target.value)}
                                                    className="flex-1 mr-4"
                                                />
                                                <span className="text-lg font-semibold text-red-300 w-16 text-right">
                                                    {inputs.currentTier1Resolution}%
                                                </span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-green-900 bg-opacity-30 p-4 rounded-lg border border-green-700">
                                        <h3 className="font-semibold text-green-300 mb-3">With Solution</h3>
                                        <div>
                                            <label className="block text-sm text-gray-300 mb-2">
                                                Tier 1 Resolution Rate
                                            </label>
                                            <div className="flex items-center">
                                                <input
                                                    type="range"
                                                    min="0"
                                                    max="100"
                                                    value={inputs.withSolutionTier1Resolution}
                                                    onChange={(e) => handleInputChange('withSolutionTier1Resolution', e.target.value)}
                                                    className="flex-1 mr-4"
                                                />
                                                <span className="text-lg font-semibold text-green-300 w-16 text-right">
                                                    {inputs.withSolutionTier1Resolution}%
                                                </span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-gray-700 p-4 rounded-lg border border-gray-600">
                                        <h3 className="font-semibold text-gray-200 mb-3">Escalation Rates (for unresolved)</h3>
                                        
                                        <div className="space-y-3">
                                            <div>
                                                <label className="block text-sm text-gray-300 mb-2">
                                                    Escalate to Tier 2
                                                </label>
                                                <div className="flex items-center">
                                                    <input
                                                        type="range"
                                                        min="0"
                                                        max="100"
                                                        value={inputs.tier2EscalationRate}
                                                        onChange={(e) => handleInputChange('tier2EscalationRate', e.target.value)}
                                                        className="flex-1 mr-4"
                                                    />
                                                    <span className="text-lg font-semibold text-gray-200 w-16 text-right">
                                                        {inputs.tier2EscalationRate}%
                                                    </span>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-sm text-gray-300 mb-2">
                                                    Escalate to Tier 3
                                                </label>
                                                <div className="flex items-center">
                                                    <input
                                                        type="range"
                                                        min="0"
                                                        max="100"
                                                        value={inputs.tier3EscalationRate}
                                                        onChange={(e) => handleInputChange('tier3EscalationRate', e.target.value)}
                                                        className="flex-1 mr-4"
                                                    />
                                                    <span className="text-lg font-semibold text-gray-200 w-16 text-right">
                                                        {inputs.tier3EscalationRate}%
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="mt-8 bg-gray-800 rounded-lg shadow-lg p-6">
                            <h2 className="text-2xl font-bold text-white mb-6">Detailed Cost Breakdown</h2>
                            
                            <div className="overflow-x-auto">
                                <table className="w-full">
                                    <thead>
                                        <tr className="border-b-2 border-gray-600">
                                            <th className="text-left py-3 px-4 text-gray-200 font-semibold">Metric</th>
                                            <th className="text-right py-3 px-4 text-gray-200 font-semibold">Current State</th>
                                            <th className="text-right py-3 px-4 text-gray-200 font-semibold">With Solution</th>
                                            <th className="text-right py-3 px-4 text-gray-200 font-semibold">Difference</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-700">
                                        <tr className="bg-gray-700 bg-opacity-50">
                                            <td className="py-3 px-4 font-medium text-gray-200">Total Annual Tickets</td>
                                            <td className="text-right py-3 px-4 text-gray-300">{formatNumber(totalAnnualTickets)}</td>
                                            <td className="text-right py-3 px-4 text-gray-300">{formatNumber(totalAnnualTickets)}</td>
                                            <td className="text-right py-3 px-4 text-gray-300">-</td>
                                        </tr>
                                        <tr>
                                            <td className="py-3 px-4 text-gray-300">Tier 1 Tickets</td>
                                            <td className="text-right py-3 px-4 text-gray-300">{formatNumber(currentTier1Tickets)}</td>
                                            <td className="text-right py-3 px-4 text-green-400 font-semibold">{formatNumber(withSolutionTier1Tickets)}</td>
                                            <td className="text-right py-3 px-4 text-green-400">+{formatNumber(withSolutionTier1Tickets - currentTier1Tickets)}</td>
                                        </tr>
                                        <tr>
                                            <td className="py-3 px-4 text-gray-300">Tier 2 Tickets</td>
                                            <td className="text-right py-3 px-4 text-gray-300">{formatNumber(currentTier2Tickets)}</td>
                                            <td className="text-right py-3 px-4 text-green-400 font-semibold">{formatNumber(withSolutionTier2Tickets)}</td>
                                            <td className="text-right py-3 px-4 text-green-400">-{formatNumber(currentTier2Tickets - withSolutionTier2Tickets)}</td>
                                        </tr>
                                        <tr>
                                            <td className="py-3 px-4 text-gray-300">Tier 3 Tickets</td>
                                            <td className="text-right py-3 px-4 text-gray-300">{formatNumber(currentTier3Tickets)}</td>
                                            <td className="text-right py-3 px-4 text-green-400 font-semibold">{formatNumber(withSolutionTier3Tickets)}</td>
                                            <td className="text-right py-3 px-4 text-green-400">-{formatNumber(currentTier3Tickets - withSolutionTier3Tickets)}</td>
                                        </tr>
                                        <tr className="border-t-2 border-gray-600 font-semibold">
                                            <td className="py-3 px-4 text-gray-200">Tier 1 Cost</td>
                                            <td className="text-right py-3 px-4 text-gray-300">{formatCurrency(currentTier1Cost)}</td>
                                            <td className="text-right py-3 px-4 text-gray-300">{formatCurrency(withSolutionTier1Cost)}</td>
                                            <td className="text-right py-3 px-4 text-gray-300">{formatCurrency(withSolutionTier1Cost - currentTier1Cost)}</td>
                                        </tr>
                                        <tr className="font-semibold">
                                            <td className="py-3 px-4 text-gray-200">Tier 2 Cost</td>
                                            <td className="text-right py-3 px-4 text-gray-300">{formatCurrency(currentTier2Cost)}</td>
                                            <td className="text-right py-3 px-4 text-gray-300">{formatCurrency(withSolutionTier2Cost)}</td>
                                            <td className="text-right py-3 px-4 text-green-400">-{formatCurrency(currentTier2Cost - withSolutionTier2Cost)}</td>
                                        </tr>
                                        <tr className="font-semibold">
                                            <td className="py-3 px-4 text-gray-200">Tier 3 Cost</td>
                                            <td className="text-right py-3 px-4 text-gray-300">{formatCurrency(currentTier3Cost)}</td>
                                            <td className="text-right py-3 px-4 text-gray-300">{formatCurrency(withSolutionTier3Cost)}</td>
                                            <td className="text-right py-3 px-4 text-green-400">-{formatCurrency(currentTier3Cost - withSolutionTier3Cost)}</td>
                                        </tr>
                                        <tr className="bg-indigo-900 bg-opacity-40 border-t-2 border-indigo-600">
                                            <td className="py-4 px-4 font-bold text-lg text-white">Total Annual Cost</td>
                                            <td className="text-right py-4 px-4 font-bold text-lg text-gray-200">{formatCurrency(currentTotalCost)}</td>
                                            <td className="text-right py-4 px-4 font-bold text-lg text-green-400">{formatCurrency(withSolutionTotalCost)}</td>
                                            <td className="text-right py-4 px-4 font-bold text-lg text-green-400">-{formatCurrency(annualSavings)}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="mt-6 bg-blue-900 bg-opacity-30 border border-blue-700 rounded-lg p-4">
                            <div className="flex items-start">
                                <AlertCircle size={20} className="text-blue-400 mr-3 mt-1 flex-shrink-0" />
                                <div className="text-sm text-blue-200">
                                    <p className="font-semibold mb-1">About This Calculator</p>
                                    <p>This ROI calculator demonstrates the cost impact of increasing Tier 1 resolution rates for collaboration app support tickets. By leveraging AI-powered troubleshooting and proactive alerting, organizations can significantly reduce expensive Tier 2 and Tier 3 escalations while improving employee experience and IT efficiency.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CollaborationROICalculator />);
    </script>
</body>
</html>
